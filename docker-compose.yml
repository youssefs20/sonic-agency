# Full production-style stack: nginx -> frontend/backend -> postgres.
#
# Configuration comes from a `.env` file next to this compose file — copy
# `.env.example` to `.env` and fill it in. Nothing sensitive is hardcoded
# here. Only nginx publishes ports; the app containers are reachable
# solely through the reverse proxy.
#
# Local test run:   docker compose up --build
# VPS deploy:       same, after setting real values in .env and pointing
#                   DNS at the server (then run certbot inside/for nginx).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sonic_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonic_db}?sslmode=disable
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # nginx is the only proxy in front of the backend; trusting the
      # compose network range lets ClientIP() see the real visitor IP
      # from X-Forwarded-For (used by the rate limiter).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* values are baked into the browser bundle at BUILD
      # time — passing this as a runtime env var would silently leave the
      # site in demo mode. It must be a build arg.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
