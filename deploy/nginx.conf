# Reverse proxy for the Sonic stack.
#
# - / and everything not under /api -> Next.js frontend
# - /api -> Go backend
#
# This config is HTTPS-ready but does NOT issue a certificate — there's
# no domain pointed at a server yet. Once you have one:
#   1. Point the domain's DNS A record at this server's IP
#   2. Install certbot (e.g. `sudo apt install certbot python3-certbot-nginx`)
#   3. Run: certbot --nginx -d yourdomain.com
#      Certbot will edit this file in place to add the `listen 443 ssl`
#      block and certificate paths automatically.

server {
    listen 80;
    server_name yourdomain.com; # replace with your real domain

    # Match the backend's own request-body cap (1MB) so oversized uploads
    # are rejected at the edge.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
